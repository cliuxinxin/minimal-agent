[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-native-agent"
version = "0.4.2"
description = "A minimal extensible agent with standard OpenAI and Anthropic tool calling"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
miniagent = "miniagent.cli:main"

[tool.setuptools.packages.find]
include = ["miniagent*"]
